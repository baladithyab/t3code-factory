<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="03-fleet-title 03-fleet-desc">
<title id="03-fleet-title">Place the work; preserve its owner.</title>
<desc id="03-fleet-desc">Proposed shared placement and admission: harness/model, target environment, and provisioning are separate choices. Sandbox candidates share one category: Blaxel, Modal, Daytona, E2B, Baseten, and others. Capabilities differ; batch jobs are optional. Provisioning does not transfer ownership. Persist artifacts and reconcile uncertain attempts before retrying.</desc>
