<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="01-one-experience-title 01-one-experience-desc">
<title id="01-one-experience-title">One thread. Many contributors. One outcome.</title>
<desc id="01-one-experience-desc">Proposed experience: one outcome can combine code, research, diagrams, and documents. Simple requests can skip decomposition. Dashed bidirectional links are addressed peer messages. Independent tasks join into an evidence-bearing result. Completion, acceptance, delivery, and settlement are separate; settlement is reversible.</desc>
