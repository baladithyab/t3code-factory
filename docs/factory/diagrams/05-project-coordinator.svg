<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" role="img" aria-labelledby="05-project-coordinator-title 05-project-coordinator-desc">
<title id="05-project-coordinator-title">Every thread can orchestrate. One optional project role.</title>
<desc id="05-project-coordinator-desc">Proposed UX: outcome threads can start directly. One ordinary thread may be designated to coordinate priorities and shared decisions for an explicit project scope. Dashed arrows mean optional coordination, not a prerequisite to launch an outcome. The current create/resume binding is checkout-local; arbitrary existing-thread assignment and revision-checked reassignment are proposed. Reassignment preserves active attempts. A role grants no extra authority.</desc>
