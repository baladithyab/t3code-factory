<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="02-runtime-title 02-runtime-desc">
<title id="02-runtime-title">Reasoning plans; durable services execute.</title>
<desc id="02-runtime-desc">Proposed Factory composition on T3 V2: models propose plans; durable services validate transitions and run accepted work. Task dependencies are distinct from execution lineage. V2 means the existing command/event/outbox engine. Peer discussion does not change ownership or acceptance; typed service commands do.</desc>
