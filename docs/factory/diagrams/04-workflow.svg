<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="04-workflow-title 04-workflow-desc">
<title id="04-workflow-title">A repeatable way to settle work.</title>
<desc id="04-workflow-desc">Proposed workflows reuse outcome threads and tasks. Manual, scheduled, and scoped event requests enter the same bounded execution loop. Filter and deduplicate events before model work. Dependency readiness drives parallel execution; phase names are presentation. Record explicit attempts or plan revisions for failures and new findings. No-op events stay quiet.</desc>
